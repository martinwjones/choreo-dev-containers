# Mock of API Manager's "Pizza Shack" sample backend. The real one is a web app bundled only in
# the all-in-one API Manager (https://<host>:9443/am/sample/pizzashack/v1/api); this lab's split
# control plane + gateways don't include it, so the sample PizzaShack API had no backend.
# Implements the sample API's operations with in-memory orders:
#   GET  /menu                  POST /order
#   GET  /order/{orderId}       PUT  /order/{orderId}       DELETE /order/{orderId}
# Endpoint for the API: http://pizzashack-backend.samples.svc.cluster.local:8080/am/sample/pizzashack/v1/api
apiVersion: v1
kind: ConfigMap
metadata:
  name: pizzashack-backend
  namespace: samples
data:
  server.js: |
    const http = require("http");
    const crypto = require("crypto");
    const BASE = "/am/sample/pizzashack/v1/api";

    const MENU = [
      { name: "BBQ Chicken Bacon", description: "Grilled white chicken, hickory-smoked bacon and fresh sliced onions in barbeque sauce", price: "14.99", icon: "/images/6.png" },
      { name: "Chicken Parmesan", description: "Grilled chicken, fresh tomatoes, feta and mozzarella cheese", price: "13.99", icon: "/images/1.png" },
      { name: "Chilly Chicken Cordon Bleu", description: "Spinash Alfredo sauce topped with grilled chicken, ham, onions and mozzarella", price: "15.99", icon: "/images/10.png" },
      { name: "Double Bacon 6Cheese", description: "Hickory-smoked bacon, Julienne cut Canadian bacon, Parmesan, mozzarella, Romano, Asiago and and Fontina cheese", price: "14.99", icon: "/images/9.png" },
      { name: "Garden Fresh", description: "Slices onions and green peppers, gourmet mushrooms, black olives and ripe Roma tomatoes", price: "12.99", icon: "/images/3.png" },
      { name: "Grilled Chicken Club", description: "Grilled white chicken, hickory-smoked bacon and fresh sliced onions topped with Roma tomatoes", price: "13.99", icon: "/images/8.png" },
      { name: "Hawaiian BBQ Chicken", description: "Grilled white chicken, hickory-smoked bacon, barbeque sauce topped with sweet pine-apple", price: "11.99", icon: "/images/7.png" },
      { name: "Spicy Italian", description: "Pepperoni and a double portion of spicy Italian sausage", price: "13.99", icon: "/images/2.png" },
      { name: "Spinach Alfredo", description: "Rich and creamy blend of spinach and garlic Parmesan with Alfredo sauce", price: "12.99", icon: "/images/5.png" },
      { name: "Tuscan Six Cheese", description: "Six cheese blend of mozzarella, Parmesan, Romano, Asiago and Fontina", price: "14.99", icon: "/images/4.png" },
    ];
    const orders = new Map();

    function send(res, status, body) {
      res.writeHead(status, { "Content-Type": "application/json" });
      res.end(body === undefined ? "" : JSON.stringify(body));
    }

    http.createServer((req, res) => {
      let data = "";
      req.on("data", (c) => (data += c));
      req.on("end", () => {
        const path = req.url.split("?")[0];
        console.log(`${req.method} ${path}`);
        if (!path.startsWith(BASE)) return send(res, 404, { error: "Not found" });
        const route = path.slice(BASE.length) || "/";
        let body = {};
        try { body = data ? JSON.parse(data) : {}; } catch { return send(res, 400, { error: "Invalid JSON" }); }

        if (req.method === "GET" && route === "/menu") return send(res, 200, MENU);
        if (req.method === "POST" && route === "/order") {
          const order = { orderId: crypto.randomUUID(), delivered: false, ...body };
          orders.set(order.orderId, order);
          return send(res, 201, order);
        }
        const m = route.match(/^\/order\/([^/]+)$/);
        if (m) {
          const order = orders.get(m[1]);
          if (!order) return send(res, 404, { error: `No order ${m[1]}` });
          if (req.method === "GET") return send(res, 200, order);
          if (req.method === "PUT") {
            const updated = { ...order, ...body, orderId: order.orderId };
            orders.set(order.orderId, updated);
            return send(res, 200, updated);
          }
          if (req.method === "DELETE") { orders.delete(order.orderId); return send(res, 200, order); }
        }
        send(res, 404, { error: `No route for ${req.method} ${route}` });
      });
    }).listen(8080, () => console.log(`Pizza Shack mock on :8080${BASE}`));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizzashack-backend
  namespace: samples
  labels:
    app.kubernetes.io/name: pizzashack-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pizzashack-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pizzashack-backend
    spec:
      containers:
        - name: backend
          image: node:22.21.1-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: pizzashack-backend
---
apiVersion: v1
kind: Service
metadata:
  name: pizzashack-backend
  namespace: samples
spec:
  selector:
    app.kubernetes.io/name: pizzashack-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
