# Local overrides applied on top of upstream/wso2am-all-in-one-4.7.0-1-values.yaml.
# install.sh adds one more file, .state/apim-secrets.yaml, with the encryption key and
# (when configured) the Moesif Application ID, so neither ends up in git.

kubernetes:
  # The chart defaults to Kubernetes Gateway API routes, which need Gateway API CRDs and
  # a Gateway resource. This lab uses the NGINX ingress set up by init-environment.sh.
  gatewayAPI:
    enabled: false
  ingress:
    management:
      enabled: true          # https://am.wso2.com -> Publisher, Devportal, Admin, Carbon
    gateway:
      enabled: true          # https://gw.wso2.com -> API gateway (8243)
    # WebSocket / WebSub APIs are not used in this unit.
    websocket:
      enabled: false
    websub:
      enabled: false

wso2:
  apim:
    configurations:
      # The chart leaves the databases empty (it expects an external RDBMS). For a single
      # lab node we use the embedded H2 databases, the same as a plain zip install.
      # Data lives inside the pod and is lost when the pod is recreated.
      databases:
        type: "h2"
        jdbc:
          driver: "org.h2.Driver"
        apim_db:
          url: "jdbc:h2:./repository/database/WSO2AM_DB;DB_CLOSE_ON_EXIT=FALSE"
          username: "wso2carbon"
          password: "wso2carbon"
        shared_db:
          url: "jdbc:h2:./repository/database/WSO2SHARED_DB;DB_CLOSE_ON_EXIT=FALSE"
          username: "wso2carbon"
          password: "wso2carbon"

  deployment:
    image:
      # The chart has no default image. Official multi-arch (amd64/arm64) wso2/wso2am:4.7.0.
      registry: "docker.io"
      repository: "wso2/wso2am"
      digest: "sha256:4de3aabbb11d16a1c00d122312503070ea8617e0829133cbcc83f35d6868b889"
      imagePullPolicy: IfNotPresent
    # The chart asks for 2 CPUs / 2 Gi up front; trimmed so it schedules on a laptop k3d node.
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "3Gi"
        cpu: "3000m"
      jvm:
        memory:
          xms: "1024m"
          xmx: "2048m"
    # The upstream startup probe allows ~2 minutes; a first start on a laptop takes 3-6.
    startupProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 60
